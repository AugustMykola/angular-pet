<div class="personal-info">
  <div class="personal-info__title">
    Personal Information
  </div>

  <div class="personal-info__row">
    <span class="personal-info__label">Full Name:</span>
    <input class="personal-info__value" value="{{ user().firstName }} {{ user().lastName }}" />
  </div>

  <div class="personal-info__row">
    <span class="personal-info__label">Email:</span>
    <input class="personal-info__value" value="{{ user().email }}" />
  </div>

  <div class="personal-info__row">
    <span class="personal-info__label">Phone:</span>
    <input class="personal-info__value" value="{{ user().phoneNumber }}" />
  </div>
  <button class="personal-info__edit-button">Edit Profile</button>
</div>
